[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xero-agent-skill"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42",
    "filelock>=3.13",
    "httpx>=0.27",
    "keyring>=24",
    "platformdirs>=4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "scripts"}

[tool.setuptools.packages.find]
where = ["scripts"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
